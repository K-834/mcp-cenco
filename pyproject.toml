[project]
name = "powerbi-mcp-agent"
version = "0.1.0"
description = "Servidor MCP para validar modelos Power BI (.pbip) contra buenas practicas y proponer disenos de reporte."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PowerBI MCP Agent" }
]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "litellm>=1.40.0",
    "jsonschema>=4.21.0",
    "markitdown[docx,pdf]>=0.1.7",
    "python-docx>=1.1.0",
]

[project.scripts]
powerbi-mcp = "server.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
